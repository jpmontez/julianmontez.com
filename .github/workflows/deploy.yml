name: Build and Deploy Blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TF_READ_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ vars.SITE_DOMAIN }}
      # The placeholder only lets `validate` run on forks without secrets; `plan` is skipped there.
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE || 'validate-only-placeholder-passphrase' }}
      HAS_READ_TOKEN: ${{ secrets.CLOUDFLARE_TF_READ_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -input=false

      - name: Validate
        run: tofu validate

      - name: Docs in sync
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: infra
          config-file: .terraform-docs.yml
          output-method: inject
          fail-on-diff: true
          git-push: false

      - name: Plan (drift check)
        if: env.HAS_READ_TOKEN == 'true'
        run: |
          set +e
          tofu plan -input=false -lock=false -detailed-exitcode
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::Live Cloudflare config differs from infra/. Apply the change locally (tofu apply) or fix the drift."
          fi
          exit "$rc"

  deploy:
    # Only validate gates content deploys; zone drift (infra) must not block publishing a post.
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Wrangler, not `cf deploy`, until cloudflare/cf#18 is fixed
      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
