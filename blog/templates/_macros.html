{% macro render_post_image(image, post, assets_prefix, image_sizes, eager_image_ids, lcp_image_id, link_href=None) -%}
  {% set image_id = image.primary_src or image.path %}
  {% set is_eager = image_id in eager_image_ids %}
  {% set is_lcp = image_id == lcp_image_id %}
  <figure>
    {%- if link_href %}<a class="post-image-link" href="{{ link_href }}">{% endif -%}
      <picture>
        {% if image.avif_srcset %}
          <source
            type="image/avif"
            srcset="{% for variant, variant_width in image.avif_srcset %}{{ assets_prefix }}/{{ variant }} {{ variant_width }}w{% if not loop.last %}, {% endif %}{% endfor %}"
            sizes="{{ image_sizes }}"
          />
        {% endif %}
        {% if image.webp_srcset %}
          <source
            type="image/webp"
            srcset="{% for variant, variant_width in image.webp_srcset %}{{ assets_prefix }}/{{ variant }} {{ variant_width }}w{% if not loop.last %}, {% endif %}{% endfor %}"
            sizes="{{ image_sizes }}"
          />
        {% endif %}
        <img
          src="{{ assets_prefix }}/{{ image.primary_src or image.path }}"
          alt="{{ image.alt if image.alt is not none else (post.title or 'Photo') }}"
          loading="{{ 'eager' if is_eager else 'lazy' }}"
          {% if is_lcp %}
          fetchpriority="high"
          {% endif %}
          {% if image.srcset %}
          srcset="{% for variant, variant_width in image.srcset %}{{ assets_prefix }}/{{ variant }} {{ variant_width }}w{% if not loop.last %}, {% endif %}{% endfor %}"
          sizes="{{ image_sizes }}"
          {% endif %}
          decoding="async"
          {% if image.width and image.height %}width="{{ image.width }}" height="{{ image.height }}"{% endif %}
        />
      </picture>
    {%- if link_href %}</a>{% endif -%}
  </figure>
{%- endmacro %}
